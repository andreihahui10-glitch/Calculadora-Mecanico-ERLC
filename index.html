<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Mecánico ER:LC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛠️ MECÁNICO ER:LC</h1>
      <p>Calculadora de Presupuestos Taller</p>
    </header>

    <div class="app-grid">
      <!-- Formulario para añadir -->
      <div class="card">
        <h2>Añadir Servicio</h2>
        <form id="form-servicio">
          <div class="form-group">
            <label>Categoría</label>
            <select id="select-categoria">
              <option value="reparaciones">Reparaciones</option>
              <option value="modificaciones">Modificaciones</option>
              <option value="mantenimiento">Mantenimiento</option>
            </select>
          </div>

          <div class="form-group">
            <label>Servicio</label>
            <select id="select-servicio"></select>
          </div>

          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" id="input-cantidad" value="1" min="1">
          </div>

          <button type="submit" class="btn btn-primary">+ AÑADIR AL PRESUPUESTO</button>
        </form>
      </div>

      <!-- Presupuesto / Recibo -->
      <div class="card">
        <h2>📋 Presupuesto</h2>
        <div id="lista-presupuesto" class="lista-items">
          <p class="vacio">No hay servicios añadidos aún.</p>
        </div>

        <div class="total-box">
          <span>TOTAL:</span>
          <span id="total-monto">$0</span>
        </div>

        <button id="btn-limpiar" class="btn btn-danger">🗑️ LIMPIAR PRESUPUESTO</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
